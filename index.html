<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع مأوى الشباب - دليل إدارة المشاريع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .step-transition { transition: all 0.5s ease-in-out; }
        .active-ring { ring: 4px solid rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="app">
        <!-- Navigation Header -->
        <header class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg">
                        <i data-lucide="home"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">رحلة مشروع Youth Haven</h1>
                        <p class="text-xs text-slate-500 font-medium tracking-tight">دليل إدارة المشاريع للتغيير المجتمعي</p>
                    </div>
                </div>
                <div id="progress-dots" class="hidden md:flex gap-1">
                    <!-- Dots will be injected here -->
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 md:p-8">
            <!-- Phase 0 Intro Visual -->
            <div id="intro-visual" class="mb-8 relative overflow-hidden rounded-3xl bg-slate-800 h-64 shadow-2xl flex items-center justify-center border-4 border-white hidden">
                <div class="absolute inset-0 opacity-30">
                    <!-- Cityscape SVG Placeholder -->
                    <svg width="100%" height="100%" viewBox="0 0 800 400" preserveAspectRatio="none">
                        <rect x="50" y="200" width="60" height="200" fill="#475569" />
                        <rect x="150" y="100" width="100" height="300" fill="#1e293b" />
                        <rect x="300" y="150" width="80" height="250" fill="#334155" />
                        <rect x="450" y="180" width="70" height="220" fill="#475569" />
                        <rect x="600" y="130" width="90" height="270" fill="#1e293b" />
                    </svg>
                </div>
                <div class="relative z-10 text-center space-y-4">
                    <div class="flex justify-center gap-4 text-amber-400">
                        <i data-lucide="eye" size="48"></i>
                        <i data-lucide="alert-circle" size="48" class="text-red-500"></i>
                    </div>
                    <h2 class="text-3xl font-black text-white px-4">هنا بدأت القصة: هيفنفورد تحت المجهر</h2>
                </div>
            </div>

            <div class="grid md:grid-cols-12 gap-8">
                <!-- Sidebar -->
                <aside class="md:col-span-4 space-y-3" id="sidebar">
                    <!-- Buttons injected by JS -->
                </aside>

                <!-- Content Area -->
                <div class="md:col-span-8">
                    <div id="main-card" class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-slate-200">
                        <div id="card-header" class="p-10 text-white relative transition-colors duration-500">
                            <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-6">
                                <div class="text-center md:text-right">
                                    <span id="phase-tag" class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase"></span>
                                    <h2 id="phase-title" class="text-4xl font-black mt-2"></h2>
                                    <p id="phase-eng" class="text-lg opacity-80 font-mono mt-1 uppercase tracking-wider"></p>
                                </div>
                                <div id="phase-icon-container" class="bg-white p-6 rounded-[2.5rem] shadow-2xl transform -rotate-6 transition-transform">
                                    <!-- Icon injected here -->
                                </div>
                            </div>
                        </div>

                        <div class="p-8 md:p-10 space-y-10">
                            <div id="summary-box" class="p-8 rounded-3xl border-2 border-dashed relative text-center">
                                <p id="summary-text" class="text-xl font-bold italic leading-relaxed"></p>
                            </div>

                            <section>
                                <div class="flex items-center gap-3 mb-4">
                                    <i data-lucide="users" class="text-slate-400"></i>
                                    <h3 class="text-2xl font-black">ماذا حدث في هيفنفورد؟</h3>
                                </div>
                                <p id="story-content" class="bg-slate-50 p-6 rounded-3xl text-lg leading-loose border-r-8 border-slate-200"></p>
                            </section>

                            <section>
                                <div class="flex items-center gap-3 mb-6">
                                    <i data-lucide="settings" class="text-slate-400"></i>
                                    <h3 class="text-2xl font-black text-slate-800">أدوات الإدارة المستخدمة</h3>
                                </div>
                                <div id="tools-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <!-- Tools injected here -->
                                </div>
                            </section>

                            <!-- Deep Dive -->
                            <div class="pt-4 border-t">
                                <button onclick="toggleDetails()" class="flex items-center justify-between w-full p-6 rounded-2xl bg-slate-50 font-black hover:bg-slate-100 transition-all">
                                    <span class="flex items-center gap-3"><i data-lucide="info"></i> معلومات تقنية للمدربين</span>
                                    <i data-lucide="chevron-down" id="chevron"></i>
                                </button>
                                <div id="details-box" class="hidden mt-4 p-6 bg-slate-900 text-slate-300 rounded-3xl shadow-2xl animate-in slide-in-from-top-2">
                                    <p id="details-content" class="text-lg leading-relaxed"></p>
                                </div>
                            </div>

                            <!-- Footer Nav -->
                            <div class="flex justify-between items-center pt-8 border-t">
                                <button onclick="prevStep()" id="prev-btn" class="flex items-center gap-2 px-6 py-3 font-bold rounded-xl transition-all">
                                    <i data-lucide="arrow-right"></i> السابقة
                                </button>
                                <button onclick="nextStep()" id="next-btn" class="flex items-center gap-2 px-8 py-4 font-black rounded-2xl text-white shadow-xl transition-all">
                                    التالية <i data-lucide="arrow-left"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-20 bg-slate-900 text-white py-20 px-6 text-center">
            <h4 class="text-3xl font-black mb-4">هيفنفورد اليوم هي مدينة أفضل.</h4>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto mb-10">إدارة المشاريع هي العلم الذي يحوّل الملاحظة إلى تغيير ملموس.</p>
            <div class="flex justify-center gap-4">
                <span class="bg-slate-800 px-4 py-2 rounded-full text-xs font-bold border border-white/10 italic text-blue-400 uppercase">Social Good DPro</span>
            </div>
        </footer>
    </div>

    <script>
        const steps = [
            { id: 0, title: "قصة مدينة هيفنفورد", eng: "The Havenford Context", color: "bg-slate-700", light: "bg-slate-50", text: "text-slate-700", icon: "map", summary: "لماذا نحتاج لهذا المشروع؟", story: "بدأت القصة بملاحظة مراهقين ينامون في الحدائق العامة في هيفنفورد. مدينة هيفنفورد مدينة تنمو، لكن هذا النمو لم يشمل الجميع.", tools: [{n: "التقييم الأولي", e: "Needs Assessment"}, {n: "الملاحظة الميدانية", e: "Observation"}, {n: "تحليل السياق", e: "Context"}], details: "البيانات أظهرت أن 40% من الشباب المشردين هم تحت سن الـ 24." },
            { id: 1, title: "تحديد المشروع", eng: "Project Identification", color: "bg-blue-600", light: "bg-blue-50", text: "text-blue-600", icon: "compass", summary: "تحويل المعاناة إلى أهداف واضحة.", story: "استخدم الفريق 'شجرة المشكلات' لربط تشرد الشباب بأسبابه مثل تفكك الأسر والنتائج مثل خطر الجريمة.", tools: [{n: "شجرة المشكلات", e: "Problem Tree"}, {n: "شجرة الأهداف", e: "Objective Tree"}, {n: "تحليل المصلحة", e: "Stakeholders"}], details: "تقرر إنشاء مركز 'Youth Haven' ليقدم خدمات متكاملة وليس مجرد مأوى." },
            { id: 2, title: "إعداد المشروع", eng: "Project Setup", color: "bg-purple-600", light: "bg-purple-50", text: "text-purple-600", icon: "settings", summary: "من الذي سيقود السفينة؟", story: "تم تشكيل مجلس إدارة يضم الشرطة والجمعيات المحلية لضمان الدعم المجتمعي للمركز في المدينة.", tools: [{n: "ميثاق المشروع", e: "Charter"}, {n: "الحوكمة", e: "Governance"}, {n: "سجل المخاطر", e: "Risk Register"}], details: "تم منح مدير المشروع صلاحية تغيير 10% من الميزانية للتصرف السريع." },
            { id: 3, title: "تخطيط المشروع", eng: "Project Planning", color: "bg-amber-500", light: "bg-amber-50", text: "text-amber-600", icon: "clipboard-list", summary: "كيف سيبدو المركز واقعياً؟", story: "تم رسم 'المسار الحرجي' لمعرفة الوقت اللازم للتجهيزات قبل حلول الشتاء القاسي على شباب هيفنفورد.", tools: [{n: "هيكل العمل", e: "WBS"}, {n: "المسار الحرجي", e: "Critical Path"}, {n: "خطة التواصل", e: "Communication"}], details: "ميزانية التجديد قدرت بـ 50,833 دولار باستخدام تقديرات واقعية." },
            { id: 4, title: "تنفيذ المشروع", eng: "Implementation", color: "bg-emerald-600", light: "bg-emerald-50", text: "text-emerald-600", icon: "play-circle", summary: "تحويل المخططات إلى حقيقة.", story: "بدأ البناء والتوظيف. واجه الفريق مشكلة في تصاريح البلدية كادت توقف العمل لولا تدخل مجلس الإدارة.", tools: [{n: "مصفوفة الأدوار", e: "RACI"}, {n: "إدارة القضايا", e: "Issues"}, {n: "المتابعة", e: "MEAL"}], details: "استخدمت مصفوفة RACI لتوضيح المسؤوليات ومنع التداخل بين الموظفين." },
            { id: 5, title: "إنهاء المشروع", eng: "Closure", color: "bg-red-500", light: "bg-red-50", text: "text-red-600", icon: "check-circle-2", summary: "أمانة تسلم للأجيال.", story: "أصبح المركز علامة فارقة. تم دمج المشروع في عمليات المنظمة الدائمة مع توثيق كل الدروس المستفادة.", tools: [{n: "الاستدامة", e: "Sustainability"}, {n: "الدروس المستفادة", e: "Lessons"}, {n: "تقرير الإغلاق", e: "Report"}], details: "إشراك الشباب في التقييم أدى لتحسين الخدمات بنسبة 60%." }
        ];

        let currentStep = 0;
        let detailsVisible = false;

        function render() {
            const step = steps[currentStep];
            
            // UI Updates
            document.getElementById('card-header').className = `${step.color} p-10 text-white relative transition-all duration-500`;
            document.getElementById('phase-tag').innerText = `PHASE ${step.id}`;
            document.getElementById('phase-title').innerText = step.title;
            document.getElementById('phase-eng').innerText = step.eng;
            document.getElementById('summary-box').className = `${step.light} p-8 rounded-3xl border-2 border-dashed ${step.text.replace('text', 'border')} text-center`;
            document.getElementById('summary-text').innerText = step.summary;
            document.getElementById('story-content').innerText = step.story;
            document.getElementById('details-content').innerText = step.details;
            document.getElementById('intro-visual').style.display = currentStep === 0 ? 'flex' : 'none';

            // Sidebar & Dots
            renderSidebar();
            renderDots();
            renderTools();

            // Icon
            const iconCont = document.getElementById('phase-icon-container');
            iconCont.innerHTML = `<i data-lucide="${step.icon}" class="w-16 h-16 ${step.text}"></i>`;
            
            // Buttons
            document.getElementById('prev-btn').disabled = currentStep === 0;
            document.getElementById('prev-btn').className = currentStep === 0 ? "opacity-20 flex items-center gap-2 px-6 py-3" : "hover:bg-slate-100 flex items-center gap-2 px-6 py-3 text-slate-600";
            document.getElementById('next-btn').className = `${step.color} text-white px-8 py-4 font-black rounded-2xl shadow-xl flex items-center gap-2 hover:scale-105 transition-all`;
            document.getElementById('next-btn').innerHTML = currentStep === steps.length - 1 ? 'نهاية الرحلة' : 'التالية <i data-lucide="arrow-left"></i>';

            lucide.createIcons();
        }

        function renderTools() {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = steps[currentStep].tools.map(t => `
                <div class="bg-white border-2 border-slate-100 p-5 rounded-2xl hover:border-blue-400 hover:shadow-lg transition-all">
                    <div class="font-black text-slate-800 text-lg">${t.n}</div>
                    <div class="text-xs text-slate-400 font-mono mt-1">${t.e}</div>
                </div>
            `).join('');
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = steps.map((s, i) => `
                <button onclick="goToStep(${i})" class="w-full text-right p-4 rounded-2xl border-2 flex items-center gap-4 transition-all ${currentStep === i ? s.color + ' text-white border-transparent shadow-xl scale-105' : 'bg-white border-slate-100 text-slate-400 hover:border-slate-300'}">
                    <div class="p-2 rounded-xl ${currentStep === i ? 'bg-white/20' : 'bg-slate-100'}">
                        <i data-lucide="${s.icon}" size="20"></i>
                    </div>
                    <div>
                        <div class="text-[10px] opacity-60 font-black">Step ${i}</div>
                        <div class="font-bold text-sm">${s.title}</div>
                    </div>
                </button>
            `).join('');
        }

        function renderDots() {
            const dots = document.getElementById('progress-dots');
            dots.innerHTML = steps.map((s, i) => `
                <div class="w-6 h-2 rounded-full ${i <= currentStep ? steps[currentStep].color : 'bg-slate-200'} transition-all"></div>
            `).join('');
        }

        function toggleDetails() {
            detailsVisible = !detailsVisible;
            document.getElementById('details-box').style.display = detailsVisible ? 'block' : 'none';
            document.getElementById('chevron').style.transform = detailsVisible ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function nextStep() { if(currentStep < steps.length - 1) { currentStep++; detailsVisible = false; render(); } }
        function prevStep() { if(currentStep > 0) { currentStep--; detailsVisible = false; render(); } }
        function goToStep(i) { currentStep = i; detailsVisible = false; render(); }

        window.onload = render;
    </script>
</body>
</html>
